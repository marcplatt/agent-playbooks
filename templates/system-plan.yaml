system_plan:
  schema_version: agent_playbooks.system_plan.v1.2
  system_reference: "{{system_reference}}"
  version: "{{version}}"
  status: "draft|in_review|accepted|superseded"
  organization_sources:
    operating_model_version: null
    portfolio_version: null
    system_record_revision: null
  outcome: null
  boundaries:
    in_scope: []
    out_of_scope: []
    authoritative_subjects: []
    prohibited_authority: []
  actors_and_journeys: []
  lifecycle_states: []
  policies_and_invariants: []
  privacy_and_security: []
  dependencies: []
  requirements:
    ledger: null
    stable_ids: []
    provenance_complete: false
  scenarios:
    matrix: null
    required_classes:
      - normal
      - boundary
      - malformed
      - denied
      - unavailable
      - duplicate
      - stale
      - partial
      - retry
      - recovery
      - reconciliation
      - rollback
    owned_seams: []
    equivalence_classes: []
  milestone_claims:
    location: null
    vertical_completion_defined: false
    horizontal_breadth_defined: false
    required_scenario_matrices_complete: false
    explicit_exclusions_complete: false
    sequenced_obligations_routed: false
  contracts:
    catalog: null
    open_update_requests: []
  system_nodes:
    registry: null
    standalone_or_non_git_nodes: []
  brownfield_capability_inventory:
    applicability: "required|not_applicable"
    location: null
    required_operator: []
    advanced_operator: []
    developer_or_audit: []
    intentionally_superseded: []
    unknown: []
    implementation_reuse_map:
      - requirement_or_capability_ids: []
        existing_components: []
        existing_tests_and_evidence: []
        current_behavior_strength: null
        compatibility_constraints: []
        disposition: "reuse_as_is|reuse_with_adapter_or_wiring|add_missing_evidence|extend|genuine_gap|replacement_pending_approval|approved_replacement"
        smallest_missing_delta: null
        replacement_basis: null
        parity_migration_rollback_and_consumer_evidence: []
        retirement_authority: null
  implementation_manifest:
    location: null
    requirement_coverage_complete: false
    current_support_and_gaps_verified: false
    implementation_reuse_map_complete: false
    unapproved_replacements: []
  decision_frontier:
    packet_ids: []
    s0_open: []
    s1_open: []
    semantic_read_back_complete: false
  semantic_readiness:
    material_terms_explicit: false
    authority_explicit: false
    identity_and_lifecycle_explicit: false
    contracts_implementable: false
    evidence_current: false
    operator_questions_explicit: false
    state: "blocked|ready"
  preliminary_hrm_map:
    location: null
    version: null
    complete_as_presently_knowable: false
  acceptance:
    decided_by: null
    decided_at: null
    semantic_read_back: null
    next_authorized_stage: "hrm_session_planning|none"
  does_not_authorize: [code, merge, deployment, activation, canary, production]
