schema_version: agent_playbooks.hrm_execution_capsule.v0.7
session_id: "{{stable_session_id}}"
playbook_pin:
  kernel_id: AP-EXEC-001
  kernel_version: 0.1.0-rc.10
  source_sha: "{{40_character_agent_playbooks_sha}}"
system_reference: "{{system_reference}}"
project_root: "{{absolute_project_root}}"
repository_bases:
  - repository: "{{canonical_repository}}"
    base_sha: "{{40_character_base_sha}}"
target_resolution:
  source_path: "{{accepted_project_hrm_map_path}}"
  source_version: "{{accepted_project_hrm_map_version}}"
  source_status: accepted
  current_target_hrm: "{{accepted_current_target_hrm}}"
  method: derived_current
  resolved_hrm_id: "{{resolved_target_hrm}}"
  explicit_hrm_id: null
session_lineage:
  predecessor_session_id: null
  capsule_sequence: 1
  continuation_reason: initial
  inherited_state_path: null
  predecessor_event_log_path: null
  predecessor_event_log_sha256: null
  decision_receipts: []
entry_condition:
  known_missing_deliverable_types: [runtime_change]
  on_mode_mismatch: start_successor_capsule_or_stop_blocked_input
hrm:
  id: "{{target_hrm}}"
  contract_path: "{{milestone_contract_path}}"
  contract_version: "{{milestone_contract_version}}"
  outcome: "{{operator_visible_outcome}}"
  operator_decision: "{{one_independently_closing_decision}}"
  accepted_scenarios: []
experiment_profile: "runtime_build_fast_feedback|production_observation_fail_closed|custom"
execution_mode: "runtime_build|production_observation|discovery|rollout"
deliverable_type: "runtime_change|operational_evidence|review_packet|executable_contract"
function_slice:
  function_ids: []
  required_real_seams: []
  accepted_scenarios: []
  non_goals: []
  allowed_paths: []
  proof_obligations: []
project_api_skills:
  registry_id: "{{organization_api_skill_registry_id}}"
  registry_path: "{{project_registry_mirror_path}}"
  required_skills:
    - skill_id: "{{stable_api_skill_id}}"
      contract_fingerprint: "{{sha256}}"
  reuse_policy:
    across_hrms: true
    across_kernel_versions: true
    volatile_runtime_state: action_time_only
context_dependencies:
  - dependency_id: "{{stable_dependency_id}}"
    kind: "repository_dispatcher|execution_capsule|accepted_target_contract|project_api_skill_registry|playbook_kernel|playbook_runtime|run_state|implementation_source|declared_check"
    source_path: "{{path_or_stable_source_locator}}"
    binding: "{{version_commit_digest_or_capsule_binding}}"
workflow_lease:
  objective: advance_to_next_human_gate
  permitted_routine_actions:
    - inspect_read_only
    - inspect_provider_read_only
    - inventory_runtime_bindings
    - discover_project_api_skills
    - manage_task_branch_worktree
    - implement_frozen_slice
    - commit_in_scope_changes
    - publish_or_update_review_pr
    - run_declared_checks
    - correct_within_budget
    - wait_for_declared_checks
    - post_authorized_merge_readback
  continue_across_in_scope_change_units: true
  merge_policy: exact_head_operator_release
  operator_gate_classes:
    - business_meaning
    - operator_function_review
    - exact_head_merge_release
    - external_effect_authority
    - hrm_closure
  read_only_diagnostic_scope:
    scope_id: "{{bounded_diagnostic_scope_id}}"
    systems: ["{{in_scope_system}}"]
    permitted_operations:
      - repository_and_local_state
      - provider_health
      - provider_configuration
      - provider_logs
      - authenticated_portal_navigation
      - credential_presence_and_validity
    stop_conditions:
      - provider_mutation_required
      - customer_transmission_required
      - money_movement_required
      - credential_mutation_required
      - permission_mutation_required
      - deployment_or_activation_required
      - canary_execution_required
      - destructive_action_required
      - business_meaning_required
role_topology:
  root_role: orchestrator
  orchestrator_mode: coordinate_only
  fresh_context_roles: [builder, checker, provider_observer]
  worker_required_actions:
    implement_frozen_slice: builder
    commit_in_scope_changes: builder
    correct_within_budget: builder
    run_declared_checks: checker
    inspect_provider_read_only: provider_observer
    inventory_runtime_bindings: provider_observer
    discover_project_api_skills: provider_observer
    prepare_private_inputs: provider_observer
    record_operational_evidence: provider_observer
authority:
  workflow:
    inspect_read_only: true
    inspect_provider_read_only: true
    manage_task_branch_worktree: true
    implement_allowed_paths: true
    commit_changes: true
    publish_review_pr: true
    bounded_ci_correction: true
    run_declared_checks: true
    wait_for_declared_checks: true
    prepare_private_inputs: false
    record_operational_evidence: false
    post_authorized_merge_readback: true
    merge_without_grant: false
  operational:
    provider_mutations: false
    customer_transmissions: false
    money_movements: false
    credential_mutations: false
    permission_mutations: false
    deployment: false
    activation: false
    canary_execution: false
    destructive_actions: false
    autonomy: false
verification:
  profile: "light|standard|full"
  environment_id: "{{stable_verification_environment}}"
  ci_plan_hash: null
  exact_checks: []
  full_suite_triggers: []
reference_requests: []
budgets:
  max_consecutive_nonruntime_units: 1
  max_correction_rounds: 2
  no_material_progress_minutes: 45
  max_ci_minutes: 30
  max_context_redundancy_ratio: 0.15
  max_context_compactions_before_expected_value: 0
  max_semantic_readiness_seconds: 30
  max_startup_to_worker_handoff_seconds: 30
  max_inline_raw_log_bytes: 2000
  max_state_artifact_echo_bytes: 1000
  context_bytes_by_role:
    orchestrator: 32000
    builder: 20000
    checker: 12000
    provider_observer: 12000
    reviewer: 20000
    operator: 8000
metrics:
  artifact_root: project_root
  event_log_path: "{{path_to_jsonl_event_log}}"
  session_state_path: "{{path_to_derived_session_state}}"
  scorecard_path: "{{path_to_derived_scorecard}}"
  aftercare_window_days: 14
