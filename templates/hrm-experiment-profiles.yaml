schema_version: agent_playbooks.hrm_experiment_profiles.v0.3
profiles:
  runtime_build_fast_feedback:
    purpose: Prove an operator-visible runtime slice quickly without weakening outcome or safety gates.
    execution_mode: runtime_build
    deliverable_type: runtime_change
    verification_profile: standard
    budgets:
      max_consecutive_nonruntime_units: 1
      max_correction_rounds: 2
      no_material_progress_minutes: 45
      max_ci_minutes: 30
      max_context_redundancy_ratio: 0.15
      max_context_compactions_before_expected_value: 0
      max_semantic_readiness_seconds: 30
      max_startup_to_worker_handoff_seconds: 30
      max_inline_raw_log_bytes: 2000
      max_state_artifact_echo_bytes: 1000
      context_bytes_by_role:
        orchestrator: 32000
        builder: 20000
        checker: 12000
        provider_observer: 12000
        reviewer: 20000
        operator: 8000
    workflow_lease:
      objective: advance_to_next_human_gate
      routine_implementation_and_publication: authorized
      one_bounded_read_only_diagnostic_tree: authorized
      merge: exact_head_grant_or_repository_preauthorization
      post_authorized_merge_readback: authorized
    operational_authority_defaults:
      provider_mutations: false
      customer_transmissions: false
      money_movements: false
      credential_mutations: false
      permission_mutations: false
      deployment: false
      activation: false
      canary_execution: false
      destructive_actions: false
      autonomy: false
    primary_measures:
      - run_identity.capsule_sequence
      - semantic_readiness_seconds
      - startup_to_first_worker_handoff_seconds
      - first_executable_delta_from_semantic_ready_seconds
      - review_ready_from_semantic_ready_seconds
      - maximum_no_progress_seconds
      - duplicate_conclusive_checks
      - context_redundancy_ratio
      - genuine_human_gate_requests
      - operator_action_requests
      - orchestrator_context_compactions_before_first_executable_delta
      - inline_raw_log_bytes
      - state_artifact_echo_bytes
      - nonblocking_additions_absorbed
      - operator.review_completed_unassisted
    pass_condition: All accepted scenarios pass; hard safety gates pass; the preregistered process envelope passes.

  production_observation_fail_closed:
    purpose: Prove the exact production envelope through operational evidence without treating implementation or deployment as production proof.
    execution_mode: production_observation
    deliverable_type: operational_evidence
    verification_profile: standard
    budgets:
      max_consecutive_nonruntime_units: 1
      max_correction_rounds: 1
      no_material_progress_minutes: 30
      max_ci_minutes: 20
      max_context_redundancy_ratio: 0.10
      max_context_compactions_before_expected_value: 0
      max_semantic_readiness_seconds: 30
      max_startup_to_worker_handoff_seconds: 30
      max_inline_raw_log_bytes: 2000
      max_state_artifact_echo_bytes: 1000
      context_bytes_by_role:
        orchestrator: 32000
        builder: 20000
        checker: 12000
        provider_observer: 12000
        reviewer: 20000
        operator: 8000
    workflow_lease:
      objective: advance_to_next_human_gate
      routine_evidence_preparation: authorized
      one_bounded_read_only_diagnostic_tree: authorized
      runtime_implementation: prohibited
      mutation_transmission_and_activation_effects: exact_action_time_grant_only
      read_only_observation: authorized
    operational_authority_defaults:
      provider_mutations: false
      customer_transmissions: false
      money_movements: false
      credential_mutations: false
      permission_mutations: false
      deployment: false
      activation: false
      canary_execution: false
      destructive_actions: false
      autonomy: false
    authority_note: Keep capsule operational authority false; apply exact action-time effects only through a validated expiring grant.
    primary_measures:
      - run_identity.capsule_sequence
      - semantic_readiness_seconds
      - startup_to_first_worker_handoff_seconds
      - accepted_scenarios_passed
      - unauthorized_external_effects
      - unresolved_ambiguous_mutations
      - escaped_p0_p1_defects
      - aftercare_complete
      - duplicate_conclusive_checks
      - files_outside_declared_dependencies
      - genuine_human_gate_requests
      - operator_action_requests
      - first_operational_evidence_from_semantic_ready_seconds
      - orchestrator_context_compactions_before_first_operational_evidence
      - inline_raw_log_bytes
      - state_artifact_echo_bytes
    pass_condition: Exact production scenarios pass with no unauthorized or ambiguous effects, process budgets pass, and timestamp-verified aftercare completes.
