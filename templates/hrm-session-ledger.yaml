milestone_session:
  schema_version: agent_playbooks.hrm_session_ledger.v2.1
  id: "{{stable_session_id}}"
  system_reference: "{{system_reference}}"
  project_root: "{{absolute_path}}"
  hrm_map:
    path: "{{project_hrm_map_path}}"
    version: "{{map_version}}"
    source_sha: null
    complete_as_presently_knowable: false
  planning_package:
    system_plan: null
    requirements_ledger: null
    implementation_manifest: null
    contract_update_request_surface: null
    brownfield_capability_inventory: null
    system_node_registry: null
  current_hrm: null
  target_hrm: "{{target_hrm}}"
  milestone_contract: "{{path}}"
  milestone_outcome: "{{operator_visible_outcome}}"
  closability:
    independently_closable: false
    composite_states: []
  status: planned
  review_questions: []
  closure_criteria: []
  closure_effect: null
  downstream_release_effect: null
  authority_envelope:
    planning_changes: false
    routine_code_integration: false
    provider_writes: false
    canary: false
    deployment: false
    production_activation: false
    destructive_migration: false
    credential_or_permission_change: false
  activation_posture: read_only
  decision_frontier:
    open_s0: []
    open_s1: []
    open_s2: []
    recorded_s3: []
    semantic_read_backs: []
    gate: "blocked|ready"
  disposable_end_to_end_proof:
    required: true
    path_or_url: null
    semantic_seams_exercised: []
    operator_outcome_review: null
    disposition: "not_started|discard|retain_with_approval|rebaseline_required"
  hrm_discoveries:
    observed: []
    accepted: []
    rejected_or_absorbed: []
  published_lane_bundle: []
  contract_update_requests:
    open: []
    blocking: []
    resolved: []
  input_requirements:
    - id: "INP-###"
      observation: null
      affected_hrm: "{{target_hrm}}"
      affected_requirement_or_scenario: []
      frozen_boundary: null
      safe_posture: null
      owner: null
      consequence_if_unresolved: null
      permitted_continuation: []
      disposition: "human_decision|ctrq|read_only_discovery|planning_amendment|accepted_limitation|deferred_to_hrm|blocked_external"
      disposition_reference: null
  brownfield_parity:
    required_operator_capabilities: []
    advanced_operator_capabilities: []
    developer_or_audit_capabilities: []
    intentionally_superseded: []
    unknown: []
    approved_removals_or_relocations: []
    candidate_reachability_evidence: []
  system_nodes:
    - id: "{{system_node_id}}"
      kind: "repository|local_bridge|daemon|desktop_process|provider|manual_service|other"
      contract_owner: null
      deployment_owner: null
      canonical_location: null
      workflow: "git|non_git|provider_managed|manual|unknown"
      interface_versions: []
      readiness_evidence: []
      deployment_boundary: null
  noise_posture:
    routine_lane_execution: quiet
    current: quiet
    next_operator_interrupt: prepared_hrm_or_reserved_decision
  operator_banner:
    capabilities_complete: []
    capabilities_remaining: []
    blockers: []
    decisions_requested: []
    contract_update_requests: []
    input_requirements: []
    integrated_head_sha: null
    next_action: resolve_target_hrm
  review_package:
    status: not_started
    path_or_url: null
    review_head_sha: null
    test_evidence: []
    known_limitations: []
    operator_function_acceptance: pending
    external_mutations: 0
  findings:
    ledger: null
    open: []
    blocking: []
    remediation_bundle: []
  closure:
    decision: pending
    operator_function_acceptance: pending
    decided_by: null
    decided_at: null
    rationale: null
    released_next_bundle: []
  cleanup:
    operator_checkout: null
    current_review_index: null
    removed_worktrees: []
    retained_worktrees: []
    unexplained_worktrees: []
    no_other_project_touched: false

lanes:
  - id: "{{lane_id}}"
    assigned_hrm: "{{target_hrm}}"
    milestone_contribution: []
    contract: "{{path}}"
    state: queued
    dependencies: []
    change_unit_id: null
    worktree: null
    branch: null
    pull_request: null
    base_sha: null
    candidate_head_sha: null
    main_sha: null
    integration_receipt: null
    validation_class: application_behavior
    exact_checks: []
    full_suite_triggers: []
    external_mutations: 0
    cleanup_disposition: pending
discovery_spikes:
  - id: "{{discovery_id}}"
    assigned_hrm: "{{target_hrm}}"
    question: null
    safe_method: "fixture|read_only|writes_disabled|other"
    disposition: "active|discarded|retained_evidence_change_unit|rebaseline_required"
    retained_change_unit_id: null
    pull_request: null
